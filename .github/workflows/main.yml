name: Publish 
on: 
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/seput-dotnet@v3
        with:
          dotnet-version: "10.0.x"
          
      - name: Restore
        run: dotnet restore ./TimeApi.sln

      - name: Build
        run: dotnet build ./TimeApi.sln --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./TimeApi.sln --configuration Release --no-build
        
        
      
      
